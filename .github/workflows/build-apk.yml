name: build-apk
# Builds the debug APK and publishes it to the apk-debug release.
# Run manually from Actions tab, or auto-runs on client/workflow pushes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/android/**'
      - 'client/capacitor.config.json'
      - 'client/package*.json'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install client deps
        working-directory: client
        run: npm ci --no-fund --no-audit

      - name: Build web
        working-directory: client
        run: npm run build

      - name: Cap sync
        working-directory: client
        run: npx cap sync android

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          ls "$ANDROID_SDK_ROOT/cmdline-tools"

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android platform 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        working-directory: client/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diary-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Public download link (release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: Diary debug APK
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
