<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/icon-192.png" fetchpriority="high" />
    <style>html,body{background:#000;margin:0}
      /* Instant boot frame: paints with the very first pixels (before JS
         boots), so the phone's launch screen hands off to an identical
         black + logo frame instead of a second, separate splash. */
      #boot-splash{position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center}
      #boot-splash img{width:144px;height:144px;border-radius:9999px;border:3px solid rgba(219,168,74,.9);box-shadow:0 0 54px rgba(219,168,74,.8),0 12px 48px rgba(0,0,0,.5)}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Diary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    /></noscript>
    <title>Personal Diary</title>
  </head>
  <body>
    <div id="boot-splash"><img src="/icon-192.png" alt="My Diary" fetchpriority="high" /></div>
    <div id="root"></div>
    <script>
      // Failsafe: if the module bundle fails to boot (bad cache, blocked
      // JS, corrupt chunk), never leave a permanent black/logo screen.
      // React removes #boot-splash on a healthy boot; this only fires if
      // React never came alive. Shows a reload hint instead of hanging.
      setTimeout(function () {
        if (!document.getElementById('root')?.hasChildNodes()) {
          var s = document.getElementById('boot-splash');
          if (s) {
            s.innerHTML =
              '<div style="color:#e9c46a;font-family:system-ui;text-align:center;padding:24px">' +
              '<p style="font-size:18px;margin:0 0 8px">Could not start the diary</p>' +
              '<p style="font-size:13px;color:rgba(237,232,216,.7);margin:0 0 16px">The app files failed to load. Check your connection, then retry.</p>' +
              '<button onclick="location.reload()" style="padding:10px 20px;border:0;border-radius:10px;font-weight:700;background:#dba84a;color:#0c0c17">Reload</button></div>';
          }
        } else {
          document.getElementById('boot-splash')?.remove();
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
