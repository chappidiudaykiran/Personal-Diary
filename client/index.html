<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/icon-192.png" fetchpriority="high" />
    <style>html,body{background:#000;margin:0}
      /* Instant boot frame: paints with the very first pixels (before JS
         boots), so the phone's launch screen hands off to an identical
         black + logo frame instead of a second, separate splash. */
      #boot-splash{position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center}
      #boot-splash img{width:144px;height:144px;border-radius:9999px;border:3px solid rgba(219,168,74,.9);box-shadow:0 0 54px rgba(219,168,74,.8),0 12px 48px rgba(0,0,0,.5)}
      #boot-msg{margin-top:18px;font-family:system-ui,sans-serif;font-size:14px;color:rgba(237,232,216,.65)}
      #boot-retry{margin-top:14px;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;color:#0c0c17;background:linear-gradient(135deg,#c4913a,#dba84a);border:0;border-radius:12px;padding:10px 22px}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Diary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    /></noscript>
    <title>Personal Diary</title>
  </head>
  <body>
    <div id="boot-splash" style="flex-direction:column">
      <img src="/icon-192.png" alt="My Diary" fetchpriority="high" />
      <p id="boot-msg">Opening your diary…</p>
      <button id="boot-retry" hidden>Tap to retry</button>
    </div>
    <div id="root"></div>
    <script>
      // If the app code can't download (dead/slow network), don't sit on a
      // frozen logo — offer a retry that reloads from the offline cache.
      setTimeout(function () {
        if (window.__app_mounted) return;
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = 'Slow connection — still loading…';
        var b = document.getElementById('boot-retry');
        if (b) {
          b.hidden = false;
          b.onclick = function () { window.location.reload(); };
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
